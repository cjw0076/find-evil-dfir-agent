<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>FIND EVIL! — DFIR Triage Console</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#121821; --panel2:#0e141c; --line:#1e2937;
    --ink:#d7e2ee; --dim:#7f93a8; --acc:#4cc2ff; --warn:#ffcc66;
    --bad:#ff6b6b; --crit:#ff4757; --ok:#48d597; --high:#ff924d; --med:#ffcc66;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  header{display:flex;align-items:center;gap:16px;padding:12px 20px;
    border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:5}
  header h1{font-size:16px;margin:0;letter-spacing:.5px}
  header h1 b{color:var(--bad)}
  .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);
    border-radius:10px;padding:2px 8px}
  select{background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:6px;padding:6px 10px;font:inherit}
  button{background:var(--acc);color:#04121c;border:0;border-radius:6px;
    padding:7px 14px;font:inherit;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5;cursor:wait}
  main{max-width:1180px;margin:0 auto;padding:18px;display:grid;gap:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:880px){.grid2{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;
    color:var(--dim);margin:0;padding:11px 14px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center}
  .card .body{padding:14px}
  .alert{border-left:4px solid var(--crit)}
  .alert .body{font-size:14px}
  .muted{color:var(--dim)}
  .pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;
    border-radius:9px;text-transform:uppercase;letter-spacing:.4px}
  .sev-critical{background:rgba(255,71,87,.16);color:var(--crit)}
  .sev-high{background:rgba(255,146,77,.16);color:var(--high)}
  .sev-medium{background:rgba(255,204,102,.16);color:var(--med)}
  .sev-low{background:rgba(127,147,168,.16);color:var(--dim)}
  .step{border-left:2px solid var(--line);padding:8px 0 8px 14px;margin-left:6px;position:relative}
  .step:before{content:"";position:absolute;left:-6px;top:13px;width:9px;height:9px;
    border-radius:50%;background:var(--dim)}
  .step.hyp:before{background:var(--warn)} .step.con:before{background:var(--bad)}
  .step.cor:before{background:var(--ok)}
  .step .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
  .hyp .k{color:var(--warn)} .con .k{color:var(--bad)} .cor .k{color:var(--ok)}
  .ref{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--acc);
    background:rgba(76,194,255,.10);border:1px solid rgba(76,194,255,.25);
    border-radius:5px;padding:1px 6px;margin:2px 4px 2px 0;cursor:pointer}
  .ref:hover{background:rgba(76,194,255,.22)}
  .finding{border:1px solid var(--line);border-radius:8px;padding:11px;margin-bottom:10px;background:var(--panel2)}
  .finding .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .mitre{font-family:var(--mono);font-size:12px;color:var(--acc);font-weight:700}
  .rec{font-size:12px;color:var(--ok);margin-top:6px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  td.mono,.mono{font-family:var(--mono)}
  .tree{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap}
  .tree .node{padding:1px 0}
  .tree .evil{color:var(--bad)}
  .tl{max-height:340px;overflow:auto}
  .tl .row{display:grid;grid-template-columns:150px 90px 1fr auto;gap:8px;
    padding:5px 0;border-bottom:1px solid var(--line);font-size:12px}
  .tl .t{font-family:var(--mono);color:var(--dim)}
  .tl .a{color:var(--acc);font-size:11px}
  .verdict-malicious{color:var(--bad);font-weight:700}
  .verdict-benign{color:var(--ok)}
  .verdict-unknown{color:var(--dim)}
  .kpi{display:flex;gap:18px;flex-wrap:wrap}
  .kpi .x{font-size:22px;font-weight:800}
  .kpi .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  details summary{cursor:pointer;color:var(--dim);font-size:12px}
  .trace{font-family:var(--mono);font-size:11.5px;max-height:300px;overflow:auto}
  .trace .ln{padding:2px 0;border-bottom:1px solid #131c26;color:var(--dim)}
  .trace .ln b{color:var(--ink)}
  #modal{position:fixed;inset:0;background:rgba(2,6,10,.7);display:none;
    align-items:center;justify-content:center;z-index:20;padding:20px}
  #modal .m{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    max-width:680px;width:100%;max-height:80vh;overflow:auto}
  #modal h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}
  #modal pre{margin:0;padding:16px;font-family:var(--mono);font-size:12px;
    white-space:pre-wrap;word-break:break-word}
  .close{float:right;cursor:pointer;color:var(--dim)}
  .loading{color:var(--dim);padding:40px;text-align:center}
</style>
</head>
<body>
<header>
  <h1><b>FIND EVIL!</b> — Evidence-Linked DFIR Triage Console</h1>
  <span class="tag" id="srcTag">synthetic</span>
  <span style="flex:1"></span>
  <select id="caseSel"></select>
  <button id="runBtn" onclick="runCase()">Investigate ▸</button>
</header>

<main id="main">
  <div class="loading" id="boot">Select a case and press Investigate.</div>
</main>

<div id="modal" onclick="if(event.target.id==='modal')closeModal()">
  <div class="m">
    <h3><span id="modalRef"></span><span class="close" onclick="closeModal()">✕ close</span></h3>
    <pre id="modalBody">loading…</pre>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let CASE = null;

async function api(p){ const r = await fetch(p); if(!r.ok) throw new Error(await r.text()); return r.json(); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function loadCases(){
  const {cases} = await api('/api/cases');
  $('#caseSel').innerHTML = cases.map(c =>
    `<option value="${c.id}">${esc(c.title)}</option>`).join('');
}

function refChip(ref){ return `<span class="ref" onclick="showRef('${ref}')">${esc(ref)}</span>`; }

async function showRef(ref){
  $('#modal').style.display='flex'; $('#modalRef').textContent=ref;
  $('#modalBody').textContent='loading…';
  try{
    const d = await api(`/api/evidence/${CASE}/${encodeURIComponent(ref)}`);
    $('#modalBody').textContent =
      `artifact : ${d.artifact}\nfile     : ${d.source_file}  (row ${d.row})\n\n`+
      JSON.stringify(d.data, null, 2);
  }catch(e){ $('#modalBody').textContent = 'could not resolve: '+ref; }
}
function closeModal(){ $('#modal').style.display='none'; }

function sevPill(s){ return `<span class="pill sev-${s}">${s}</span>`; }

function renderTree(pt){
  if(!pt.items || !pt.items.length) return '<span class="muted">no process telemetry</span>';
  const evil = /powershell|mshta|regsvr32|certutil|wmic|svch0st|rundll32|comsvcs|vssadmin|wbadmin|bcdedit|\/dev\/tcp|media\.php|robocopy|xcopy|7z/i;
  return '<div class="tree">'+pt.items.map(n=>{
    const indent = '  '.repeat(n.depth||0);
    const img = (n.image||'?').split(/[\\\/]/).pop();
    const cmd = n.cmdline ? '  '+esc((n.cmdline||'').slice(0,90)) : '';
    const cls = evil.test((n.cmdline||'')+(n.image||'')) ? 'evil' : '';
    return `<div class="node ${cls}">${indent}${n.depth?'└─ ':''}<b>${esc(img)}</b>`+
      `<span class="muted"> pid ${esc(n.pid)}</span>${esc(cmd)} ${refChip(n.ref)}</div>`;
  }).join('')+'</div>';
}

function renderTimeline(tl){
  if(!tl.items||!tl.items.length) return '<span class="muted">no events</span>';
  return '<div class="tl">'+tl.items.map(r=>
    `<div class="row"><span class="t">${esc(r.time_utc)}</span>`+
    `<span class="a">${esc(r.artifact)}</span>`+
    `<span>${esc((r.action||'').slice(0,120))}</span>`+
    `<span>${refChip(r.ref)}</span></div>`).join('')+'</div>';
}

function renderIocs(io){
  if(!io.items||!io.items.length) return '<span class="muted">none</span>';
  return '<table><tr><th>indicator</th><th>type</th><th>verdict</th><th>intel</th><th>refs</th></tr>'+
    io.items.map(i=>`<tr><td class="mono">${esc(i.indicator)}</td><td>${esc(i.type)}</td>`+
    `<td class="verdict-${i.verdict}">${esc(i.verdict)}</td>`+
    `<td class="muted">${esc(i.ti_note||'')}</td>`+
    `<td>${(i.refs||[]).slice(0,3).map(refChip).join('')}</td></tr>`).join('')+'</table>';
}

function renderAnalyzers(an){
  const order=['super_timeline','process_tree','persistence_sweep','lolbin_scan',
    'decode_powershell','extract_iocs','lateral_movement_graph'];
  return order.filter(k=>an[k]).map(k=>{
    const a=an[k]; let extra='';
    if(k==='decode_powershell'){
      extra = a.items.filter(i=>i.logged_script_block||i.decoded_from_cmdline).map(i=>
        `<div class="mono" style="margin:6px 0;font-size:11.5px;color:var(--ok)">`+
        `decoded: ${esc((i.logged_script_block||i.decoded_from_cmdline||'').slice(0,140))} ${refChip(i.ref)}</div>`).join('');
    } else if(k==='lolbin_scan'){
      extra = a.items.map(i=>`<div style="margin:4px 0;font-size:12px">`+
        `<span class="mono" style="color:var(--high)">${esc(i.binary)}</span> `+
        `<span class="muted">${esc(i.abuse)}</span> <span class="mitre">${esc(i.mitre)}</span> ${refChip(i.ref)}</div>`).join('');
    } else if(k==='persistence_sweep'){
      extra = a.items.filter(i=>i.suspicious).map(i=>`<div style="margin:4px 0;font-size:12px">`+
        `<span class="mono">${esc(i.mechanism)}</span> ${esc(i.name||'')} → `+
        `<span class="muted">${esc((i.target||'').slice(0,70))}</span> <span class="mitre">${esc(i.mitre)}</span> ${refChip(i.ref)}</div>`).join('');
    } else if(k==='lateral_movement_graph'){
      extra = a.items.map(i=>`<div style="margin:4px 0;font-size:12px">`+
        `<span class="mono">${esc(i.src)}</span> →[${esc(i.proto)}]→ <span class="mono">${esc(i.dst)}</span> ${refChip(i.ref)}</div>`).join('');
    }
    return `<details ${k==='process_tree'||k==='lolbin_scan'?'open':''}>`+
      `<summary><b style="color:var(--ink)">${esc(a.title)}</b> — ${esc(a.summary)}</summary>`+
      `<div style="padding:8px 0 4px">${extra||'<span class="muted">(rendered in dedicated panel)</span>'}</div></details>`;
  }).join('');
}

function renderNarrative(ns){
  return ns.map(s=>{
    if(s.kind==='hypothesis')
      return `<div class="step hyp"><div class="k">Hypothesis ${esc(s.hypothesis_id)} · conf ${s.confidence}</div>${esc(s.statement)}</div>`;
    if(s.kind==='contradiction')
      return `<div class="step con"><div class="k">Contradiction on ${esc(s.hypothesis_id)}</div>${esc(s.reason)}`+
        `<div style="margin-top:4px">${(s.evidence_refs||[]).map(refChip).join('')}</div></div>`;
    if(s.kind==='self_correction')
      return `<div class="step cor"><div class="k">Self-correction ${esc(s.from_hypothesis)} → corrected</div>`+
        `${esc(s.to_statement)}<div class="muted" style="margin-top:4px;font-size:12px">${esc(s.rationale)}</div></div>`;
    return '';
  }).join('');
}

function renderTrace(tr){
  return '<div class="trace">'+tr.map(s=>{
    let t=`#${String(s.step).padStart(2,'0')} [${s.kind}]`;
    if(s.kind==='tool_call') t+=` ${s.tool} → ${s.result_count} rows`;
    else if(s.kind==='hypothesis') t+=` ${s.hypothesis_id} (${s.confidence})`;
    else if(s.kind==='self_correction') t+=` ${s.from_hypothesis} → corrected`;
    else if(s.kind==='finding') t+=` ${s.evidence_id} ${s.label}`;
    else if(s.kind==='analysis') t+=` ${s.analyzer}: ${s.summary}`;
    else if(s.kind==='note') t+=` ${s.text}`;
    else if(s.kind==='contradiction') t+=` ${s.hypothesis_id}: ${s.reason}`;
    return `<div class="ln"><b>${esc(t)}</b></div>`;
  }).join('')+'</div>';
}

async function runCase(){
  CASE = $('#caseSel').value;
  $('#runBtn').disabled=true;
  $('#main').innerHTML='<div class="loading">Running triage agent over evidence…</div>';
  try{
    const d = await api('/api/investigate/'+CASE);
    $('#srcTag').textContent = d.evidence_source;
    const acc=d.accuracy||{};
    const M = `
    <div class="card alert"><h2>Alert / Trigger <span class="muted">${esc(d.platform)} · ${esc(d.attack_class)}</span></h2>
      <div class="body"><b>${esc(d.title)}</b><br>${esc(d.alert.summary||'')}
      <div class="muted" style="margin-top:6px">trigger ${esc(d.alert.trigger_time_utc||'')} · source ${esc(d.alert.source||'')}</div></div></div>

    <div class="card"><h2>Accuracy self-check (vs synthetic ground truth)</h2><div class="body">
      <div class="kpi">
        <div><div class="x" style="color:var(--ok)">${acc.recall??'-'}</div><div class="l">recall</div></div>
        <div><div class="x" style="color:var(--ok)">${acc.precision??'-'}</div><div class="l">precision</div></div>
        <div><div class="x" style="color:${acc.decoy_rejected?'var(--ok)':'var(--bad)'}">${acc.decoy_rejected?'YES':'NO'}</div><div class="l">decoy rejected</div></div>
        <div><div class="x">${(acc.detected_techniques||[]).length}</div><div class="l">MITRE techniques</div></div>
        <div><div class="x">${d.evidence_rows}</div><div class="l">evidence rows</div></div>
        <div><div class="x">${d.findings.length}</div><div class="l">findings</div></div>
      </div></div></div>

    <div class="grid2">
      <div class="card"><h2>Reasoning — hypothesis → contradiction → self-correction</h2>
        <div class="body">${renderNarrative(d.narrative)}</div></div>
      <div class="card"><h2>Process tree (Sysmon parent/child)</h2>
        <div class="body">${renderTree(d.process_tree)}</div></div>
    </div>

    <div class="card"><h2>MITRE ATT&CK findings <span class="muted">click any ref to view the raw evidence row</span></h2>
      <div class="body">${d.findings.map(f=>`
        <div class="finding"><div class="top">${sevPill(f.severity)}
          <span class="mitre">${esc(f.mitre)}</span>
          <span class="muted mono">${esc(f.evidence_id)}</span></div>
          <div>${esc(f.summary)}</div>
          <div style="margin-top:6px">${(f.evidence_refs||[]).map(refChip).join('')}</div>
          ${f.iocs&&f.iocs.length?`<div class="muted" style="margin-top:4px;font-size:12px">IOCs: ${f.iocs.map(esc).join(', ')}</div>`:''}
          <div class="rec">▸ ${esc(f.recommendation)}</div></div>`).join('')}</div></div>

    <div class="grid2">
      <div class="card"><h2>Attack timeline (artifact fusion)</h2><div class="body">${renderTimeline(d.timeline)}</div></div>
      <div class="card"><h2>IOCs + threat-intel correlation</h2><div class="body">${renderIocs(d.iocs)}</div></div>
    </div>

    <div class="card"><h2>Forensic analyzers (breadth-of-analysis)</h2><div class="body">${renderAnalyzers(d.analyzers)}</div></div>

    <div class="grid2">
      <div class="card"><h2>Containment playbook (recommendation-only)</h2>
        <div class="body">${d.containment.map(x=>`<div style="margin:4px 0">▸ ${esc(x)}</div>`).join('')}</div></div>
      <div class="card"><h2>Replayable trace <span class="muted">${d.trace_steps} steps · ${d.ledger_records} ledger records</span></h2>
        <div class="body">${renderTrace(d.trace)}</div></div>
    </div>`;
    $('#main').innerHTML = M;
  }catch(e){
    $('#main').innerHTML = '<div class="loading" style="color:var(--bad)">Error: '+esc(e.message)+'</div>';
  }finally{ $('#runBtn').disabled=false; }
}

loadCases();
</script>
</body>
</html>
